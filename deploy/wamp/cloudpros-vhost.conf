# CloudPros virtual host for WampServer (Apache 2.4).
#
# Where it goes: Wamp tray icon -> Apache -> httpd-vhosts.conf (the file is
# C:\wamp64\bin\apache\apache2.4.xx\conf\extra\httpd-vhosts.conf). Paste this at the end,
# change the three values in the Define lines, save, then Wamp tray -> Restart All Services.
# Full steps: deploy/wamp/README.md

Define CLOUDPROS_HOST "cloudpros.lan"
Define CLOUDPROS_ROOT "C:/wamp64/www/cloudpros"
Define CLOUDPROS_CERTS "C:/wamp64/certs"

# Hide the Apache and OS version in headers and error pages (server-wide).
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# ---- Step 1: plain HTTP ---------------------------------------------------------
<VirtualHost *:80>
    ServerName ${CLOUDPROS_HOST}
    DocumentRoot "${CLOUDPROS_ROOT}"

    <Directory "${CLOUDPROS_ROOT}/">
        Options -Indexes +FollowSymLinks
        # Lets the site's own .htaccess block private files and add security headers.
        AllowOverride All
        # Who may open the site. Start with this computer only:
        Require local
        # ...then, to open it to your office network, replace the line above with your
        # LAN range(s), for example:
        # Require ip 192.168.1.0/24
    </Directory>

    # ---- Step 2: once HTTPS works (section below), delete the <Directory> block
    # above and the DocumentRoot line, and keep only this redirect:
    # Redirect permanent / https://${CLOUDPROS_HOST}/

    ErrorLog "${INSTALL_DIR}/logs/cloudpros-error.log"
    CustomLog "${INSTALL_DIR}/logs/cloudpros-access.log" combined
</VirtualHost>

