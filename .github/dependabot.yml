# Weekly update pull requests for the GitHub Actions the checks use and the npm tools.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      timezone: Asia/Riyadh
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      timezone: Asia/Riyadh
    commit-message:
      prefix: deps
