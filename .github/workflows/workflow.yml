# File: .github/workflows/workflow.yml
# Azure Login Authentication Workflow - FIXED VERSION

on: [push]

name: Run Azure Login with Service Principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # FIX: Added subscription-id parameter (was missing)
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}  # ← REQUIRED
          allow-no-subscriptions: false
          enable-AzPSSession: true

      - name: Azure CLI script
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            echo "Successfully authenticated to Azure"
            az account show

      - name: Run Azure PowerShell
        uses: azure/powershell@v3
        with:
          azPSVersion: "latest"
          inlineScript: |
            Get-AzContext

      # FIX: Added logout step for cleanup
      - name: Logout from Azure
        uses: azure/cli@v2
        if: always()
        with:
          azcliversion: latest
          inlineScript: |
            az logout
